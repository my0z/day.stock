name: surge-picks

# 세션 트리거가 surge/run_request.txt 를 갱신해 푸시하면 실행된다
on:
  push:
    branches: [main]
    paths: [surge/run_request.txt, surge/site.py]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: surge-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas pyarrow numpy scikit-learn requests
      - name: 추천 실행 (run_request 가 바뀐 경우만)
        if: contains(github.event.head_commit.modified, 'surge/run_request.txt') || contains(github.event.head_commit.added, 'surge/run_request.txt') || github.event_name == 'workflow_dispatch'
        run: python -m surge.live $(grep -q force surge/run_request.txt && echo --force)
      - name: 사이트 생성
        run: python -m surge.site
      - name: 결과 커밋
        run: |
          git config user.name "surge-bot"
          git config user.email "surge-bot@users.noreply.github.com"
          git add surge_data site
          git commit -m "surge picks $(TZ=Asia/Seoul date +%Y%m%d-%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep 3; done
      # Pages 는 저장소 설정에서 Source 를 GitHub Actions 로 한 번 켜 둬야 한다. 안 켜져 있어도 추천은 실패하지 않는다
      - name: Pages 설정
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
