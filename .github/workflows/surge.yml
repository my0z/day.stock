name: surge-picks

# 세션 트리거가 surge/run_request.txt 를 갱신해 푸시하면 실행된다
on:
  push:
    branches: [main]
    paths: [surge/run_request.txt, surge/site.py, site/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surge-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas pyarrow numpy scikit-learn requests
      - name: 추천 실행 (run_request 가 바뀐 경우만)
        if: contains(github.event.head_commit.modified, 'surge/run_request.txt') || contains(github.event.head_commit.added, 'surge/run_request.txt') || github.event_name == 'workflow_dispatch'
        run: python -m surge.live $(grep -q force surge/run_request.txt && echo --force)
      - name: 사이트 생성
        run: python -m surge.site
      - name: 결과 커밋
        run: |
          git config user.name "surge-bot"
          git config user.email "surge-bot@users.noreply.github.com"
          git add surge_data site
          git commit -m "surge picks $(TZ=Asia/Seoul date +%Y%m%d-%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep 3; done
      # 사이트 배포 (Cloudflare Workers -> ss.usb.kr). 저장소 비밀 CLOUDFLARE_API_TOKEN 이 있어야 한다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: 사이트 배포
        working-directory: site
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 709dcc6af36c8ee7b6d3d99e7a9fe422
        run: |
          test -n "$TOKEN" || { echo "::warning::CLOUDFLARE_API_TOKEN 비밀이 없어 사이트 배포를 건너뛴다"; exit 0; }
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$TOKEN" | sed 's/^[[:space:]]*[Bb]earer[[:space:]]*//' | tr -d '[:space:]"')"
          npx wrangler deploy
